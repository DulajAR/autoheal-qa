
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoHeal-QA Recovery Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="brand">AUTOHEAL QA</div>

      <h1>Recovery Test Application</h1>
      <p>Simulate real-world UI changes and locator failures.</p>

      <label for="version">Application Version</label>
      <select id="version">
        <option value="a">Version A — Original UI</option>
        <option value="b">Version B — Changed UI</option>
      </select>

      <form id="login-form">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
        />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

        <div id="button-container"></div>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
