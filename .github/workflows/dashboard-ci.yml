
name: AutoHeal QA - Dashboard CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  dashboard-quality:
    name: Dashboard Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: TypeScript validation
        run: npm run typecheck

      - name: Reporting regression tests
        run: npm run test:reporting

      - name: Dashboard browser tests
        run: npm run test:dashboard

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'

      - name: Upload dashboard failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-test-artifacts
          path: test-results/dashboard/
          if-no-files-found: ignore
          retention-days: 7
