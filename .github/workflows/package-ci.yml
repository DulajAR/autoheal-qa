
name: AutoHeal QA - Package Integration CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "src/**"
      - "config/**"
      - "bin/**"
      - "tests/package/**"
      - "docs/**"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/package-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autoheal-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-integration:
    name: Package Integration - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install framework dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Run package consumer integration tests
        run: npm run test:package
