
name: AutoHeal QA CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autoheal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript and Reporting Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Reporting regression tests
        run: npm run test:reporting

      - name: Publish quality summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AutoHeal QA - Quality Checks"
            echo ""
            echo "TypeScript and reporting validation completed."
            echo ""
            echo "Review the individual job steps for results."
          } >> "$GITHUB_STEP_SUMMARY"
