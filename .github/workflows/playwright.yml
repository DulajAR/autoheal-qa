
name: AutoHeal QA - Playwright CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Prevent overlapping executions for the same source branch.
concurrency:
  group: autoheal-history-${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  playwright-tests:
    name: TypeScript, Cross-Browser and Reliability Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # 5. Validate TypeScript
      - name: Validate TypeScript
        run: npm run typecheck

      # 6. Clear previous execution outputs.
      # Never delete historical history.json here.
      - name: Prepare fresh AutoHeal execution
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports/autoheal

          rm -f reports/autoheal/summary.json
          rm -f reports/autoheal/reliability.json
          rm -f reports/autoheal/analytics.html
          rm -f reports/autoheal/history.json

          echo "prepared=true" >> "$GITHUB_OUTPUT"

          echo "Fresh execution environment prepared."
          echo "Previous execution reports removed."
          echo "Historical data will be restored separately."

      # 7. Run main cross-browser suite.
      # Preserve the original test exit code.
      - name: Run cross-browser tests
        id: cross_browser
        shell: bash
        run: |
          set +e

          npm test
          test_exit_code=$?

          echo "exit_code=$test_exit_code" >> "$GITHUB_OUTPUT"

          exit "$test_exit_code"
        env:
          CI: "true"
          TEST_ENV: demo
          BASE_URL: https://the-internet.herokuapp.com
          HEADLESS: "true"
          WORKERS: "1"

      # 8. Validate the custom healing audit.
      # Do not run this if the cross-browser suite failed.
      - name: Validate self-healing audit
        id: healing_audit
        if: steps.cross_browser.outcome == 'success'
        run: node scripts/validate-healing-report.cjs

      # 9. Run isolated reliability regression suite.
      # It remains independent of the main Playwright config.
      - name: Run self-healing reliability tests
        id: reliability
        if: steps.cross_browser.outcome == 'success' && steps.healing_audit.outcome == 'success'
        run: npm run test:reliability
        env:
          CI: "true"
          TEST_ENV: demo
          HEADLESS: "true"

      # 10. Restore previous historical analytics.
      # A failed restoration must not silently corrupt history.
      - name: Restore previous AutoHeal history
        id: restore_history
        if: always() && steps.prepare.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          HISTORY_BRANCH: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p reports/autoheal

          echo "Searching historical artifacts..."
          echo "Branch: $HISTORY_BRANCH"
          echo "Current run: $CURRENT_RUN_ID"

          run_ids=$(gh run list \
            --repo "$REPOSITORY" \
            --workflow playwright.yml \
            --branch "$HISTORY_BRANCH" \
            --status completed \
            --limit 100 \
            --json databaseId,event \
            --jq '.[] | select(
              .event == "push" or
              .event == "workflow_dispatch" or
              .event == "pull_request"
            ) | .databaseId')

          restored=false

          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue

            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
              continue
            fi

            echo "Checking previous workflow run: $run_id"

            temp_dir=$(mktemp -d)

            if gh run download "$run_id" \
              --repo "$REPOSITORY" \
              --name autoheal-analytics \
              --dir "$temp_dir"; then

              history_file=""

              if [ -f "$temp_dir/history.json" ]; then
                history_file="$temp_dir/history.json"
              elif [ -f "$temp_dir/reports/autoheal/history.json" ]; then
                history_file="$temp_dir/reports/autoheal/history.json"
              fi

              if [ -n "$history_file" ]; then

                if jq -e '
                  type == "object"
                  and .schemaVersion == 1
                  and (.runs | type == "array")
                  and all(.runs[]; type == "object")
                ' "$history_file" >/dev/null; then

                  cp "$history_file" \
                    reports/autoheal/history.json

                  echo "Previous history restored successfully."
                  echo "Source workflow run: $run_id"

                  restored=true
                else
                  echo "Invalid historical data in run $run_id"
                fi

              else
                echo "history.json missing from run $run_id"
              fi

            else
              echo "No downloadable analytics artifact in run $run_id"
            fi

            rm -rf "$temp_dir"

            if [ "$restored" = true ]; then
              break
            fi

          done <<< "$run_ids"

          if [ "$restored" = true ]; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "No usable previous history found."
            echo "Starting a new historical dataset."
          fi

      # 11. Generate historical analytics only from the
      # current workflow's valid execution summary.
      - name: Generate AutoHeal Historical Analytics
        id: analytics
        if: always() && steps.prepare.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          SUMMARY="reports/autoheal/summary.json"

          if [ ! -f "$SUMMARY" ]; then
            echo "No execution summary produced by this workflow."
            echo "Skipping historical analytics."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! node -e '
            const fs = require("fs");
            const summary = JSON.parse(
              fs.readFileSync(process.argv[1], "utf8")
            );

            if (
              summary.framework !== "AutoHeal QA" ||
              !Array.isArray(summary.tests) ||
              summary.tests.length === 0 ||
              summary.totalAttempts !== summary.tests.length
            ) {
              process.exit(1);
            }
          ' "$SUMMARY"; then
            echo "::error::Invalid AutoHeal execution summary."
            exit 1
          fi

          echo "Generating execution history..."
          node scripts/generate-history.cjs

          echo "Analyzing test reliability..."
          node scripts/analyze-reliability.cjs

          echo "Generating analytics dashboard..."
          node scripts/generate-analytics.cjs

          echo "generated=true" >> "$GITHUB_OUTPUT"

          echo "Historical analytics generated successfully."

      # 12. Publish a readable GitHub Actions summary.
      - name: Publish CI execution summary
        if: always()
        shell: bash
        env:
          CROSS_BROWSER_RESULT: ${{ steps.cross_browser.outcome }}
          CROSS_BROWSER_EXIT: ${{ steps.cross_browser.outputs.exit_code }}
          RELIABILITY_RESULT: ${{ steps.reliability.outcome }}
          ANALYTICS_RESULT: ${{ steps.analytics.outcome }}
          HISTORY_RESTORED: ${{ steps.restore_history.outputs.restored }}
        run: |
          {
            echo "## AutoHeal QA — CI Execution"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Branch | $GITHUB_REF_NAME |"
            echo "| Commit | $GITHUB_SHA |"
            echo "| Cross-browser result | $CROSS_BROWSER_RESULT |"
            echo "| Cross-browser exit code | ${CROSS_BROWSER_EXIT:-not executed} |"
            echo "| Reliability suite | $RELIABILITY_RESULT |"
            echo "| Historical analytics | $ANALYTICS_RESULT |"
            echo "| Previous history restored | ${HISTORY_RESTORED:-unknown} |"

            if [ -f reports/autoheal/summary.json ]; then
              node -e '
                const fs = require("fs");

                try {
                  const s = JSON.parse(
                    fs.readFileSync(
                      "reports/autoheal/summary.json",
                      "utf8"
                    )
                  );

                  console.log(
                    `| Test attempts | ${s.totalAttempts ?? "N/A"} |`
                  );
                  console.log(
                    `| Passed attempts | ${s.passedAttempts ?? "N/A"} |`
                  );
                  console.log(
                    `| Failed attempts | ${s.failedAttempts ?? "N/A"} |`
                  );
                  console.log(
                    `| Healing events | ${s.healing?.totalEvents ?? 0} |`
                  );
                } catch (error) {
                  console.log(
                    "| Execution summary | Invalid JSON |"
                  );
                }
              '
            else
              echo "| Execution summary | Not generated |"
            fi

          } >> "$GITHUB_STEP_SUMMARY"

      # 13. Upload test diagnostics even if tests fail.
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoheal-qa-test-results
          path: |
            reports/html/
            reports/junit/
            reports/reliability-tests/
            test-results/
          if-no-files-found: warn
          retention-days: 7

      # 14. Upload execution summary and historical analytics.
      - name: Upload AutoHeal Analytics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoheal-analytics
          path: |
            reports/autoheal/summary.json
            reports/autoheal/history.json
            reports/autoheal/reliability.json
            reports/autoheal/analytics.html
          if-no-files-found: warn
          retention-days: 14
