
name: AutoHeal QA - Playwright CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Prevent overlapping executions from using stale history.
concurrency:
  group: autoheal-history-${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  playwright-tests:
    name: TypeScript and Cross-Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Step 5: Validate TypeScript
      - name: Validate TypeScript
        run: npm run typecheck

      # Step 6: Run cross-browser tests
      - name: Run cross-browser tests
        run: npx playwright test
        env:
          CI: "true"
          TEST_ENV: demo
          BASE_URL: https://the-internet.herokuapp.com
          HEADLESS: "true"
          WORKERS: "1"

      # Step 7: Validate self-healing audit
      - name: Validate self-healing audit
        if: success()
        run: node scripts/validate-healing-report.cjs

      # Step 8: Restore historical data from a previous run
      - name: Restore previous AutoHeal history
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          HISTORY_BRANCH: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p reports/autoheal

          echo "Searching historical artifacts for branch: $HISTORY_BRANCH"

          # Find completed workflow runs on this branch.
          run_ids=$(gh run list \
            --repo "$REPOSITORY" \
            --workflow playwright.yml \
            --branch "$HISTORY_BRANCH" \
            --status completed \
            --limit 100 \
            --json databaseId,event \
            --jq '.[] | select(.event == "push" or .event == "workflow_dispatch" or .event == "pull_request") | .databaseId')

          restored=false

          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue

            # Do not restore from the current execution.
            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
              continue
            fi

            echo "Checking workflow run: $run_id"

            # Fetch metadata for the candidate run.
            run_info=$(gh api \
              "repos/$REPOSITORY/actions/runs/$run_id" \
              --jq '{path: .path, head_branch: .head_branch, head_repository: .head_repository.full_name}')

            # Verify the workflow file.
            if ! jq -e \
              '.path | strings | contains("playwright.yml@")' \
              <<< "$run_info" >/dev/null; then
              continue
            fi

            # Verify that the source repository and branch match.
            if ! jq -e \
              --arg branch "$HISTORY_BRANCH" \
              --arg repo "$REPOSITORY" \
              '.head_branch == $branch and .head_repository == $repo' \
              <<< "$run_info" >/dev/null; then
              continue
            fi

            # Locate an unexpired AutoHeal analytics artifact.
            artifact_id=$(gh api \
              "repos/$REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq '.artifacts[] | select(.name == "autoheal-analytics" and .expired == false) | .id' \
              | head -n 1)

            if [ -z "$artifact_id" ]; then
              echo "No usable analytics artifact in run $run_id"
              continue
            fi

            echo "Found artifact: $artifact_id"

            temp_dir=$(mktemp -d)

            # Download artifact ZIP, following GitHub redirects.
            if curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
              -o "$temp_dir/artifact.zip"; then

              # Support both possible ZIP paths.
              if unzip -p "$temp_dir/artifact.zip" \
                history.json \
                > "$temp_dir/history.json" 2>/dev/null \
                || unzip -p "$temp_dir/artifact.zip" \
                reports/autoheal/history.json \
                > "$temp_dir/history.json" 2>/dev/null; then

                # Confirm that the history file is valid JSON.
                if jq -e 'type == "object"' \
                  "$temp_dir/history.json" >/dev/null; then

                  cp "$temp_dir/history.json" \
                    reports/autoheal/history.json

                  echo "Previous history restored successfully."
                  restored=true
                else
                  echo "Previous history JSON is invalid."
                fi
              else
                echo "History file not found inside artifact."
              fi
            else
              echo "Artifact download failed for run $run_id"
            fi

            rm -rf "$temp_dir"

            if [ "$restored" = true ]; then
              break
            fi
          done <<< "$run_ids"

          if [ "$restored" = false ]; then
            echo "No usable previous history found."
            echo "Starting a new historical dataset."
          fi

      # Step 9: Generate historical analytics
      - name: Generate AutoHeal Historical Analytics
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -f reports/autoheal/summary.json ]; then
            echo "Generating execution history..."
            node scripts/generate-history.cjs

            echo "Analyzing test reliability..."
            node scripts/analyze-reliability.cjs

            echo "Generating analytics dashboard..."
            node scripts/generate-analytics.cjs

            echo "Historical analytics generated successfully."
          else
            echo "AutoHeal summary report not found."
            echo "Skipping historical analytics generation."
          fi

      # Step 10: Upload Playwright reports and traces
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoheal-qa-test-results
          path: |
            reports/html/
            test-results/
          if-no-files-found: warn
          retention-days: 7

      # Step 11: Upload AutoHeal analytics
      - name: Upload AutoHeal Analytics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoheal-analytics
          path: |
            reports/autoheal/summary.json
            reports/autoheal/history.json
            reports/autoheal/reliability.json
            reports/autoheal/analytics.html
          if-no-files-found: warn
          retention-days: 14
