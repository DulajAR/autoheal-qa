
name: AutoHeal QA - Playwright CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-tests:
    name: TypeScript and Cross-Browser Tests

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Install all supported browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Validate TypeScript
      - name: Validate TypeScript
        run: npm run typecheck

      # Run tests across all configured browsers
      - name: Run cross-browser tests
        run: npx playwright test
        env:
          CI: "true"
          TEST_ENV: demo
          BASE_URL: https://the-internet.herokuapp.com
          HEADLESS: "true"
          WORKERS: "1"

      # Upload reports and debugging artifacts
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoheal-qa-test-results
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 7
